services:
  # Aplicação Completa Conecta Palavras (Backend + Frontend unificados)
  - type: web
    name: conecta-palavras
    runtime: node
    plan: free
    buildCommand: pnpm install && pnpm build
    startCommand: node apps/server/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGINS
        value: "*"
